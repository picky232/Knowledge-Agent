<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Knowledge Agent</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --ink: #1c1e1b;
    --ink-muted: #6b6f68;
    --accent: #3a6b66;
    --accent-soft: #e2ece9;
    --line: #e2ddd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 680px; }
  .msg.user { align-self: flex-end; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent); color: white; }
  .msg.agent .bubble { background: var(--surface); border: 1px solid var(--line); }
  .msg.agent .bubble.pending::after {
    content: "▍";
    animation: blink 1s step-start infinite;
    color: var(--ink-muted);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .status {
    font-size: 13.5px;
    color: var(--ink-muted);
    padding: 4px 2px;
  }
  .status::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .citations {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .citations summary {
    cursor: pointer;
    color: var(--ink-muted);
    padding: 2px 0;
    user-select: none;
  }
  .citations summary:hover { color: var(--accent); }
  .citation-row { padding: 3px 0 0 12px; }
  .citations a { color: var(--accent); text-decoration: none; }
  .citations a:hover { text-decoration: underline; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14.5px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--ink-muted); font-size: 13px; padding: 40px 20px; text-align: center; }
</style>
</head>
<body>
  <header><span class="dot"></span> Knowledge Agent</header>
  <div id="log">
    <div class="hint">GitHub · Notion · 대화기록 · 웹서칭 · 브라우저 히스토리에서 찾아 답합니다.</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="질문을 입력하세요" autocomplete="off" autofocus>
    <button id="send" type="submit">보내기</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return { wrap, bubble };
}

// 출처는 기본으로 접어둔다 — 대화 중에 매번 링크 목록이 끼어들면
// 읽기 흐름이 끊기므로, 확인하고 싶을 때만 펼치게 한다.
function renderCitations(wrap, citations) {
  if (!citations || citations.length === 0) return;

  const seen = new Set();
  const rows = [];
  for (const c of citations) {
    const key = c.source + c.title + c.url;
    if (seen.has(key)) continue;
    seen.add(key);
    rows.push(c);
  }
  if (rows.length === 0) return;

  const details = document.createElement('details');
  details.className = 'citations';
  const summary = document.createElement('summary');
  summary.textContent = `출처 ${rows.length}개`;
  details.appendChild(summary);

  for (const c of rows) {
    const date = (c.updated_at || '').slice(0, 10);
    const row = document.createElement('div');
    row.className = 'citation-row';
    if (c.url) {
      const a = document.createElement('a');
      a.href = c.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = c.title || c.url;
      row.append(`[${c.source}] `, a, ` (${date})`);
    } else {
      row.textContent = `[${c.source}] ${c.title} (${date})`;
    }
    details.appendChild(row);
  }
  wrap.appendChild(details);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  document.querySelector('.hint')?.remove();
  addMsg('user', question);
  input.value = '';
  sendBtn.disabled = true;

  const { wrap, bubble } = addMsg('agent', '');
  const status = document.createElement('div');
  status.className = 'status';
  status.textContent = '검색 중…';
  wrap.insertBefore(status, bubble);
  bubble.style.display = 'none';

  const showAnswer = () => {
    status.remove();
    bubble.style.display = '';
  };

  const es = new EventSource(`/api/ask-stream?question=${encodeURIComponent(question)}`);
  es.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'searching') {
      status.textContent = '검색 중…';
    } else if (data.type === 'generating') {
      status.textContent = '생각 중…';
    } else if (data.type === 'token') {
      if (status.isConnected) showAnswer();
      bubble.textContent += data.text;
      log.scrollTop = log.scrollHeight;
    } else if (data.type === 'done') {
      showAnswer();
      renderCitations(wrap, data.citations);
      es.close();
      sendBtn.disabled = false;
      input.focus();
    } else if (data.type === 'error') {
      showAnswer();
      bubble.textContent += `\n[오류: ${data.message}]`;
      es.close();
      sendBtn.disabled = false;
    }
  };
  es.onerror = () => {
    showAnswer();
    es.close();
    sendBtn.disabled = false;
  };
});
</script>
</body>
</html>
