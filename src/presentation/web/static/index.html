<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Knowledge Agent</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --ink: #1c1e1b;
    --ink-muted: #6b6f68;
    --accent: #3a6b66;
    --accent-soft: #e2ece9;
    --line: #e2ddd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 680px; }
  .msg.user { align-self: flex-end; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent); color: white; }
  .msg.agent .bubble { background: var(--surface); border: 1px solid var(--line); }
  .msg.agent .bubble.pending::after {
    content: "▍";
    animation: blink 1s step-start infinite;
    color: var(--ink-muted);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .citations {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .citations a { color: var(--accent); text-decoration: none; }
  .citations a:hover { text-decoration: underline; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14.5px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--ink-muted); font-size: 13px; padding: 40px 20px; text-align: center; }
</style>
</head>
<body>
  <header><span class="dot"></span> Knowledge Agent</header>
  <div id="log">
    <div class="hint">GitHub · Notion · 대화기록 · 웹서칭 · 브라우저 히스토리에서 찾아 답합니다.</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="질문을 입력하세요" autocomplete="off" autofocus>
    <button id="send" type="submit">보내기</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return { wrap, bubble };
}

function renderCitations(wrap, citations) {
  if (!citations || citations.length === 0) return;
  const seen = new Set();
  const box = document.createElement('div');
  box.className = 'citations';
  for (const c of citations) {
    const key = c.source + c.title + c.url;
    if (seen.has(key)) continue;
    seen.add(key);
    const date = (c.updated_at || '').slice(0, 10);
    const row = document.createElement('div');
    row.innerHTML = `[${c.source}] ${c.title} (${date}) — <a href="${c.url}" target="_blank" rel="noopener">${c.url}</a>`;
    box.appendChild(row);
  }
  wrap.appendChild(box);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  document.querySelector('.hint')?.remove();
  addMsg('user', question);
  input.value = '';
  sendBtn.disabled = true;

  const { wrap, bubble } = addMsg('agent', '');
  bubble.classList.add('pending');

  const es = new EventSource(`/api/ask-stream?question=${encodeURIComponent(question)}`);
  es.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'token') {
      bubble.textContent += data.text;
      log.scrollTop = log.scrollHeight;
    } else if (data.type === 'done') {
      bubble.classList.remove('pending');
      renderCitations(wrap, data.citations);
      es.close();
      sendBtn.disabled = false;
      input.focus();
    } else if (data.type === 'error') {
      bubble.classList.remove('pending');
      bubble.textContent += `\n[오류: ${data.message}]`;
      es.close();
      sendBtn.disabled = false;
    }
  };
  es.onerror = () => {
    bubble.classList.remove('pending');
    es.close();
    sendBtn.disabled = false;
  };
});
</script>
</body>
</html>
