<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Knowledge Agent</title>
<style>
  :root {
    --bg: rgba(28, 30, 27, 0.96);
    --surface: rgba(255, 255, 255, 0.06);
    --ink: #EDEAE1;
    --ink-muted: #9AA093;
    --accent: #7FBBAF;
    --line: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #ask {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  #ask::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-size: 19px;
    font-family: inherit;
  }
  #input::placeholder { color: var(--ink-muted); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 4px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #log:empty { display: none; }
  .turn { font-size: 14.5px; line-height: 1.65; }
  .turn .q { color: var(--ink-muted); margin-bottom: 4px; }
  .turn .a { white-space: pre-wrap; }
  .status { color: var(--ink-muted); font-size: 14px; }
  .status::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  .cites { margin-top: 6px; font-size: 11.5px; color: var(--ink-muted); }
  .cites summary { cursor: pointer; }
  .cites div { padding: 2px 0 0 10px; }
  .cites a { color: var(--accent); text-decoration: none; }
  .hint { color: var(--ink-muted); font-size: 12.5px; padding: 0 18px 14px; }
</style>
</head>
<body>
  <div id="ask">
    <input id="input" type="text" placeholder="무엇을 찾을까요?" autocomplete="off" autofocus>
  </div>
  <div id="log"></div>
  <div class="hint" id="hint">Esc로 닫기 · 창을 닫아도 대화는 기록에 남습니다</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const hint = document.getElementById('hint');

// 창을 열 때마다 화면은 비운다 — 매번 새로 시작하는 느낌을 위해.
// 실제 대화 내용은 서버가 파일로 남기므로 나중에 검색된다.
window.addEventListener('pywebviewready', () => { log.innerHTML = ''; });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    fetch('/api/hide').catch(() => {});
  }
});

function renderCites(wrap, citations) {
  if (!citations || citations.length === 0) return;
  const seen = new Set();
  const box = document.createElement('details');
  box.className = 'cites';
  const sum = document.createElement('summary');
  box.appendChild(sum);
  let n = 0;
  for (const c of citations) {
    const key = c.source + c.title;
    if (seen.has(key)) continue;
    seen.add(key);
    n++;
    const row = document.createElement('div');
    if (c.url) {
      const a = document.createElement('a');
      a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = c.title || c.url;
      row.append(`[${c.source}] `, a);
    } else {
      row.textContent = `[${c.source}] ${c.title}`;
    }
    box.appendChild(row);
  }
  sum.textContent = `출처 ${n}개`;
  wrap.appendChild(box);
}

input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  hint.style.display = 'none';

  const turn = document.createElement('div');
  turn.className = 'turn';
  const q = document.createElement('div');
  q.className = 'q';
  q.textContent = question;
  const status = document.createElement('div');
  status.className = 'status';
  status.textContent = '검색 중';
  const a = document.createElement('div');
  a.className = 'a';
  a.style.display = 'none';
  turn.append(q, status, a);
  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;

  const show = () => { status.remove(); a.style.display = ''; };
  const es = new EventSource(`/api/ask-stream?question=${encodeURIComponent(question)}`);
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'searching') status.textContent = '검색 중';
    else if (d.type === 'generating') status.textContent = '생각 중';
    else if (d.type === 'token') {
      if (status.isConnected) show();
      a.textContent += d.text;
      log.scrollTop = log.scrollHeight;
    } else if (d.type === 'done') {
      show();
      renderCites(turn, d.citations);
      es.close();
      input.focus();
    } else if (d.type === 'error') {
      show();
      a.textContent += `\n[오류: ${d.message}]`;
      es.close();
    }
  };
  es.onerror = () => { show(); es.close(); };
});
</script>
</body>
</html>
